# 같은 서버를 여러 명이 써도 컨테이너가 겹치지 않도록 사용자별 이름 사용
name: ros_sandbox_${USER:-user}

services:
  ros:
    build: .
    # PID 1에 작은 init(tini)을 둬서 끝난 노드 프로세스를 정리(좀비 방지)
    init: true
    command: sleep infinity
    environment:
      - DISPLAY=${DISPLAY:-}
    volumes:
      - ./ws:/ws
      - /tmp/.X11-unix:/tmp/.X11-unix
